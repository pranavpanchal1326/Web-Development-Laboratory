<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23dbeafe' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .star-rating input[type="radio"] {
            display: none;
        }
        .star-rating label {
            font-size: 2.5rem;
            color: #d1d5db; /* gray-300 */
            cursor: pointer;
            transition: color 0.2s ease-in-out, transform 0.2s ease-in-out;
        }
        .star-rating label:hover {
            transform: scale(1.2);
        }
        .star-rating input[type="radio"]:hover ~ label,
        .star-rating input[type="radio"]:checked ~ label {
            color: #f59e0b; /* amber-500 */
        }
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
        }
        /* Animation for form elements */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .form-element {
            animation: fadeInUp 0.5s ease-in-out forwards;
            opacity: 0;
        }
        /* Input validation styles */
        .input-valid {
            border-color: #10b981; /* green-500 */
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        .input-invalid {
            border-color: #ef4444; /* red-500 */
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            height: 1.25rem;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white/90 backdrop-blur-sm p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-lg">
        <div class="text-center mb-8 form-element" style="animation-delay: 0.1s;">
            <h1 class="text-3xl font-bold text-gray-800">We Value Your Feedback!</h1>
            <p class="text-gray-500 mt-2">Help us improve by sharing your experience.</p>
        </div>
        <form action="FeedbackServlet" method="post" id="feedbackForm" class="space-y-4">
            <!-- Name Input -->
            <div class="form-element" style="animation-delay: 0.2s;">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5">
                        <i class="fas fa-user text-gray-400"></i>
                    </span>
                    <input type="text" id="name" name="name" required
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150 ease-in-out"
                           placeholder="Your Name">
                </div>
                <p id="nameError" class="error-message mt-1"></p>
            </div>

            <!-- Email Input -->
            <div class="form-element" style="animation-delay: 0.3s;">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5">
                        <i class="fas fa-envelope text-gray-400"></i>
                    </span>
                    <input type="email" id="email" name="email" required
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150 ease-in-out"
                           placeholder="your.email@example.com">
                </div>
                <p id="emailError" class="error-message mt-1"></p>
            </div>

            <!-- Rating Input -->
            <div class="form-element" style="animation-delay: 0.4s;">
                <label class="block text-gray-700 text-sm font-medium mb-2 text-center">How would you rate us?</label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5 stars">&#9733;</label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars">&#9733;</label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars">&#9733;</label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars">&#9733;</label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 star">&#9733;</label>
                </div>
                 <p id="ratingError" class="error-message mt-1 text-center"></p>
            </div>

            <!-- Comments Textarea -->
            <div class="form-element" style="animation-delay: 0.5s;">
                <div class="relative">
                     <span class="absolute top-4 left-0 flex items-center pl-3.5">
                        <i class="fas fa-comment-dots text-gray-400"></i>
                    </span>
                    <textarea id="comments" name="comments" rows="4" required
                              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150 ease-in-out"
                              placeholder="Share your experience..."></textarea>
                </div>
                <p id="commentsError" class="error-message mt-1"></p>
            </div>

            <!-- Submit Button -->
            <div class="pt-4 form-element" style="animation-delay: 0.6s;">
                <button type="submit" id="submitButton"
                        class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 flex items-center justify-center transition-all transform hover:scale-105 duration-300 ease-in-out shadow-lg">
                    <span id="buttonText">Submit Feedback</span>
                    <div id="loader" class="loader hidden"></div>
                </button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('feedbackForm');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const commentsInput = document.getElementById('comments');
            const ratingInputs = document.querySelectorAll('input[name="rating"]');
            
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const commentsError = document.getElementById('commentsError');
            const ratingError = document.getElementById('ratingError');

            const submitButton = document.getElementById('submitButton');
            const buttonText = document.getElementById('buttonText');
            const loader = document.getElementById('loader');

            const validateName = () => {
                if (nameInput.value.trim() === '') {
                    nameError.textContent = 'Name is required.';
                    nameInput.classList.add('input-invalid');
                    nameInput.classList.remove('input-valid');
                    return false;
                }
                nameError.textContent = '';
                nameInput.classList.add('input-valid');
                nameInput.classList.remove('input-invalid');
                return true;
            };

            const validateEmail = () => {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(emailInput.value)) {
                    emailError.textContent = 'Please enter a valid email address.';
                    emailInput.classList.add('input-invalid');
                    emailInput.classList.remove('input-valid');
                    return false;
                }
                emailError.textContent = '';
                emailInput.classList.add('input-valid');
                emailInput.classList.remove('input-invalid');
                return true;
            };

            const validateComments = () => {
                if (commentsInput.value.trim() === '') {
                    commentsError.textContent = 'Comments are required.';
                    commentsInput.classList.add('input-invalid');
                    commentsInput.classList.remove('input-valid');
                    return false;
                }
                commentsError.textContent = '';
                commentsInput.classList.add('input-valid');
                commentsInput.classList.remove('input-invalid');
                return true;
            };

            const validateRating = () => {
                const isRatingSelected = Array.from(ratingInputs).some(radio => radio.checked);
                if (!isRatingSelected) {
                    ratingError.textContent = 'Please select a rating.';
                    return false;
                }
                ratingError.textContent = '';
                return true;
            };

            nameInput.addEventListener('input', validateName);
            emailInput.addEventListener('input', validateEmail);
            commentsInput.addEventListener('input', validateComments);
            ratingInputs.forEach(radio => radio.addEventListener('change', validateRating));

            form.addEventListener('submit', (event) => {
                event.preventDefault(); // Prevent default submission

                // Run all validations
                const isNameValid = validateName();
                const isEmailValid = validateEmail();
                const isCommentsValid = validateComments();
                const isRatingValid = validateRating();

                if (isNameValid && isEmailValid && isCommentsValid && isRatingValid) {
                    // Show loader and disable button
                    buttonText.classList.add('hidden');
                    loader.classList.remove('hidden');
                    submitButton.disabled = true;
                    submitButton.classList.add('cursor-not-allowed');
                    
                    // Simulate a short delay before submission for visual effect
                    setTimeout(() => {
                        form.submit();
                    }, 1000);
                }
            });
        });
    </script>
</body>
</html>
